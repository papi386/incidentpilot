name: Live Model Evaluation

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Number of complete corpus repetitions
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: live-model-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Read-only investigator evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      INCIDENTPILOT_EVAL_BASE_URL: ${{ vars.INCIDENTPILOT_EVAL_BASE_URL }}
      INCIDENTPILOT_EVAL_MODEL: ${{ vars.INCIDENTPILOT_EVAL_MODEL }}
      INCIDENTPILOT_EVAL_API_KEY: ${{ secrets.INCIDENTPILOT_EVAL_API_KEY }}
      INCIDENTPILOT_EVAL_INPUT_USD_PER_MILLION: ${{ vars.INCIDENTPILOT_EVAL_INPUT_USD_PER_MILLION }}
      INCIDENTPILOT_EVAL_OUTPUT_USD_PER_MILLION: ${{ vars.INCIDENTPILOT_EVAL_OUTPUT_USD_PER_MILLION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts

      - name: Verify evaluation code
        run: npm run typecheck && npm test

      - name: Run the live corpus with hard security gates
        run: npm run eval:live -- --model-calls-enabled --gate-security --no-write --repeat "${{ inputs.repeat }}"
